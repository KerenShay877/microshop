include:
  - docker-compose.infra.yml

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      API_GATEWAY_PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      AUTH_SERVICE_URL: http://auth-service:3006
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_EXPORTER: otlp
    depends_on:
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - auth-service

  product-service:
    build: ./services/product-service
    ports:
      - "3001:3001"
    environment:
      PRODUCT_SERVICE_PORT: 3001
      PRODUCT_DB_URL: postgresql://postgres:postgres@product-db:5432/products
      OTEL_SERVICE_NAME: product-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      product-db:
        condition: service_started

  order-service:
    build: ./services/order-service
    ports:
      - "3002:3002"
    environment:
      ORDER_SERVICE_PORT: 3002
      ORDER_DB_URL: postgresql://postgres:postgres@order-db:5432/orders
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      order-db:
        condition: service_started
      rabbitmq:
        condition: service_started

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "3003:3003"
    environment:
      INVENTORY_SERVICE_PORT: 3003
      INVENTORY_DB_URL: postgresql://postgres:postgres@inventory-db:5432/inventory
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      inventory-db:
        condition: service_started
      rabbitmq:
        condition: service_started

  payment-service:
    build: ./services/payment-service
    ports:
      - "3004:3004"
    environment:
      PAYMENT_SERVICE_PORT: 3004
      PAYMENT_DB_URL: postgresql+asyncpg://postgres:postgres@payment-db:5432/payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: ""
    depends_on:
      payment-db:
        condition: service_started
      rabbitmq:
        condition: service_started

  notification-service:
    build: ./services/notification-service
    ports:
      - "3005:3005"
    environment:
      NOTIFICATION_SERVICE_PORT: 3005
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      rabbitmq:
        condition: service_started

  auth-service:
    build: ./services/auth-service
    ports:
      - "3006:3006"
    environment:
      AUTH_SERVICE_PORT: 3006
      AUTH_DB_URL: postgresql://postgres:postgres@auth-db:5432/auth
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      auth-db:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:3000
    depends_on:
      - api-gateway
