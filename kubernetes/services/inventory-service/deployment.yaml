apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: microshop/inventory-service:latest
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: inventory-service-config
            - secretRef:
                name: microshop-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
