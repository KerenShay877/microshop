apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: microshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: migrate
          image: microshop/payment-service:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: microshop-secrets
      containers:
        - name: payment-service
          image: microshop/payment-service:latest
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: payment-service-config
            - secretRef:
                name: microshop-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
