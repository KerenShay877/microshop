<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#0a0a0a"/>

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>

  <!-- Main shape: abstract shopping bag / M -->
  <g transform="translate(100, 88)">
    <!-- Bag body -->
    <path d="M-42,10 L-34,-40 L0,-55 L34,-40 L42,10 Z" fill="url(#grad2)" opacity="0.9"/>
    <!-- Bag front face -->
    <path d="M-42,10 L-34,-40 L0,-55 L34,-40 L42,10 L38,42 L-38,42 Z" fill="url(#grad1)"/>
    <!-- Shine/highlight -->
    <path d="M-34,-40 L0,-55 L10,-40 L0,-30 Z" fill="url(#accent)" opacity="0.4"/>
    <!-- Handle -->
    <path d="M-18,-30 Q-18,-62 0,-72 Q18,-62 18,-30" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <!-- M inside -->
    <path d="M-18,0 L-18,-20 L0,-8 L18,-20 L18,0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Bottom text -->
  <text x="100" y="155" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="1">micro<tspan fill="#818cf8">shop</tspan></text>
</svg>