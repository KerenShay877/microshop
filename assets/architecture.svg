<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700" letter-spacing="0.5">MicroShop — Event-Driven Architecture</text>
  <text x="550" y="62" text-anchor="middle" fill="#64748b" font-size="12">Polyglot Microservices · Saga Pattern · Distributed Tracing · Kubernetes</text>

  <!-- ===== LAYER 1: Frontend ===== -->
  <rect x="420" y="82" width="220" height="52" rx="10" fill="#000" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="105" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600" letter-spacing="1.5">FRONTEND</text>
  <text x="530" y="123" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Next.js 14 · TypeScript</text>

  <!-- ===== Arrow: Frontend → Gateway ===== -->
  <line x1="530" y1="134" x2="530" y2="164" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="530,168 526,160 534,160" fill="#6366f1"/>
  <text x="548" y="155" fill="#818cf8" font-size="9">tRPC + HTTP</text>

  <!-- ===== LAYER 2: API Gateway ===== -->
  <rect x="340" y="168" width="380" height="52" rx="10" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="190" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600" letter-spacing="1.5">API GATEWAY · BUN</text>
  <text x="530" y="209" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">JWT Auth · Rate Limiting · Proxy</text>

  <!-- ===== LAYER 3: Services ===== -->

  <!-- Product Service -->
  <rect x="30" y="260" width="170" height="80" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="283" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600" letter-spacing="1">PRODUCT SERVICE</text>
  <text x="115" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Bun · Fastify</text>
  <text x="115" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">CRUD · Search · Categories</text>

  <!-- Order Service -->
  <rect x="230" y="260" width="170" height="80" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="315" y="283" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600" letter-spacing="1">ORDER SERVICE</text>
  <text x="315" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Bun · Fastify</text>
  <text x="315" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">Saga Orchestrator · Pub/Sub</text>

  <!-- Inventory Service -->
  <rect x="430" y="260" width="170" height="80" rx="10" fill="#1a1a2e" stroke="#00add8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="283" text-anchor="middle" fill="#67e8f9" font-size="9" font-weight="600" letter-spacing="1">INVENTORY SERVICE</text>
  <text x="515" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Go · Chi Router</text>
  <text x="515" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">Stock · Reservations</text>

  <!-- Payment Service -->
  <rect x="630" y="260" width="170" height="80" rx="10" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="715" y="283" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600" letter-spacing="1">PAYMENT SERVICE</text>
  <text x="715" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Python · FastAPI</text>
  <text x="715" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">Mock Payments · Idempotency</text>

  <!-- Notification Service -->
  <rect x="830" y="260" width="170" height="80" rx="10" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="915" y="283" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600" letter-spacing="1">NOTIFICATION SERVICE</text>
  <text x="915" y="300" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Bun · Express + WS</text>
  <text x="915" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">WebSocket · Email (SMTP)</text>

  <!-- ===== Arrows: Gateway → Services ===== -->
  <line x1="440" y1="220" x2="115" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="220" x2="315" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="220" x2="515" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="580" y1="220" x2="715" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="220" x2="915" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== LAYER 4: RabbitMQ (Event Bus) ===== -->
  <rect x="150" y="390" width="800" height="56" rx="10" fill="#1a1a2e" stroke="#ff6600" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="412" text-anchor="middle" fill="#fb923c" font-size="10" font-weight="600" letter-spacing="2">RABBITMQ · EVENT BUS</text>
  <text x="550" y="431" text-anchor="middle" fill="#e2e8f0" font-size="11">order.created → inventory.reserved → payment.completed → order.confirmed</text>

  <!-- Arrows: Services → RabbitMQ -->
  <line x1="315" y1="340" x2="315" y2="390" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="315,394 311,386 319,386" fill="#f97316"/>
  <line x1="515" y1="340" x2="515" y2="390" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="515,394 511,386 519,386" fill="#f97316"/>
  <line x1="715" y1="340" x2="715" y2="390" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="715,394 711,386 719,386" fill="#f97316"/>
  <line x1="915" y1="340" x2="915" y2="390" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="915,394 911,386 919,386" fill="#f97316"/>

  <!-- ===== LAYER 5: Infrastructure ===== -->

  <!-- PostgreSQL -->
  <rect x="30" y="490" width="340" height="70" rx="10" fill="#1a1a2e" stroke="#336791" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="513" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600" letter-spacing="1.5">POSTGRESQL × 5 DATABASES</text>
  <text x="200" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">auth · products · orders · inventory · payments</text>
  <text x="200" y="548" text-anchor="middle" fill="#64748b" font-size="9">StatefulSet · 10Gi PVC · init.sql creates all 5 DBs</text>

  <!-- Jaeger -->
  <rect x="400" y="490" width="200" height="70" rx="10" fill="#1a1a2e" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="513" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600" letter-spacing="1.5">JAEGER</text>
  <text x="500" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">OpenTelemetry Tracing</text>
  <text x="500" y="548" text-anchor="middle" fill="#64748b" font-size="9">OTLP HTTP · W3C Trace Context</text>

  <!-- Kubernetes -->
  <rect x="630" y="490" width="200" height="70" rx="10" fill="#1a1a2e" stroke="#326ce5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="513" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600" letter-spacing="1.5">KUBERNETES</text>
  <text x="730" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">Kustomize · HPA · Ingress</text>
  <text x="730" y="548" text-anchor="middle" fill="#64748b" font-size="9">41 manifests · init containers · probes</text>

  <!-- CI/CD -->
  <rect x="860" y="490" width="200" height="70" rx="10" fill="#1a1a2e" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="513" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600" letter-spacing="1.5">CI/CD</text>
  <text x="960" y="532" text-anchor="middle" fill="#94a3b8" font-size="9">GitHub Actions</text>
  <text x="960" y="548" text-anchor="middle" fill="#64748b" font-size="9">Lint → Build → Deploy → Smoke Test</text>

  <!-- Arrows: RabbitMQ → Databases -->
  <line x1="200" y1="390" x2="200" y2="490" stroke="#336791" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="446" x2="500" y2="490" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="730" y1="446" x2="730" y2="490" stroke="#326ce5" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="960" y1="446" x2="960" y2="490" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== Legend ===== -->
  <rect x="30" y="590" width="1040" height="70" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="612" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">LEGEND</text>

  <rect x="50" y="622" width="12" height="12" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68" y="633" fill="#94a3b8" font-size="10">Bun / TypeScript</text>

  <rect x="175" y="622" width="12" height="12" rx="2" fill="none" stroke="#00add8" stroke-width="1.5"/>
  <text x="193" y="633" fill="#94a3b8" font-size="10">Go</text>

  <rect x="230" y="622" width="12" height="12" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="248" y="633" fill="#94a3b8" font-size="10">Python</text>

  <rect x="305" y="622" width="12" height="12" rx="2" fill="none" stroke="#ff6600" stroke-width="1.5"/>
  <text x="323" y="633" fill="#94a3b8" font-size="10">Event Bus (RabbitMQ)</text>

  <rect x="470" y="622" width="12" height="12" rx="2" fill="none" stroke="#336791" stroke-width="1.5"/>
  <text x="488" y="633" fill="#94a3b8" font-size="10">PostgreSQL</text>

  <line x1="600" y1="628" x2="630" y2="628" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="636" y="633" fill="#94a3b8" font-size="10">Synchronous (HTTP)</text>

  <line x1="780" y1="628" x2="810" y2="628" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="814,628 808,624 808,632" fill="#f97316"/>
  <text x="820" y="633" fill="#94a3b8" font-size="10">Asynchronous (Events)</text>

  <text x="550" y="648" text-anchor="middle" fill="#475569" font-size="9">45 tests · 15 containers · 4 languages · 41 K8s manifests · Distributed tracing across sync + async boundaries</text>
</svg>