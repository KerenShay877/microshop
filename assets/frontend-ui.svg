<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="btnGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
    <clipPath id="browserFrame">
      <rect x="0" y="0" width="1200" height="750" rx="12"/>
    </clipPath>
  </defs>

  <!-- Browser window -->
  <g clip-path="url(#browserFrame)">
    <!-- Browser chrome -->
    <rect width="1200" height="38" fill="#1f2937" rx="12"/>
    <rect y="12" width="1200" height="26" fill="#1f2937"/>
    <circle cx="22" cy="19" r="6" fill="#ef4444"/>
    <circle cx="42" cy="19" r="6" fill="#eab308"/>
    <circle cx="62" cy="19" r="6" fill="#22c55e"/>
    <rect x="160" y="8" width="500" height="22" rx="11" fill="#111827"/>
